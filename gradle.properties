# JVM-параметры демона Gradle. Больше памяти + G1GC заметно ускоряет сборку.
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Параллельная сборка, кэш и configuration cache.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.daemon=true
org.gradle.unsafe.configuration-cache-problems=warn

# Kotlin: инкрементальная компиляция + параллельный сборщик.
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.parallel.tasks.in.project=true
ksp.incremental=true

# AndroidX и R8 full mode — даёт сильное сжатие APK и более агрессивные оптимизации.
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
