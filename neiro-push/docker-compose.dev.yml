services:
  neiro-push:
    build: .
    container_name: neiro-push-dev
    env_file:
      - .env
    ports:
      - "127.0.0.1:8012:8012"
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./scripts:/app/scripts
      - ./data:/data
    command: [
      "uvicorn", "app.main:app",
      "--host", "0.0.0.0", "--port", "8012",
      "--reload", "--reload-include", "*.html",
    ]
