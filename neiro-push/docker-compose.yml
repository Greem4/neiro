services:
  neiro-push:
    build: .
    container_name: neiro-push
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 8012: свой порт от прежних поколений (8010 и 8011), чтобы они могли
      # работать рядом во время перехода. Оба погашены, порт менять незачем.
      - "127.0.0.1:8012:8012"
    volumes:
      - neiro_push_data:/data
      - ./secrets:/secrets:ro
    networks:
      - server_web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  server_web:
    external: true
    name: server_web

volumes:
  neiro_push_data:
