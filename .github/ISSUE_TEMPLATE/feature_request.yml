name: Предложить улучшение
description: Чего не хватает в работе с приложением
title: "[Идея]: "
labels: ["идея"]
body:
  - type: markdown
    attributes:
      value: |
        Расскажите про задачу, а не про решение: «не получается понять, сколько
        выйдет за месяц с учётом переносов» полезнее, чем «добавьте кнопку X».
        Задачу почти всегда можно решить несколькими способами, и лучший из них
        виден только тогда, когда понятно, что именно не получается.

        Приложение личное — приоритет у задач владельца, поэтому часть
        предложений останется без реализации. Это не значит, что они плохие
        ([CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)).

  - type: textarea
    id: problem
    attributes:
      label: Что не получается сделать сейчас
      description: Опишите ситуацию, в которой вы упёрлись
      placeholder: |
        Хочу понять, сколько занятий перенеслось за неделю, но перенос виден
        только внутри дня — приходится открывать каждый день подряд.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Как обходитесь сейчас
      description: Если никак — так и напишите
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: Каким видите решение (по желанию)
      description: Если есть мысль — она пригодится, но задача важнее
    validations:
      required: false
