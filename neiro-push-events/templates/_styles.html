{# Общие стили дашборда и страницы устройства — чтобы две страницы не разъезжались. #}
<style>
  :root {
    --bg: #101216;
    --card: #191c22;
    --card-hover: #1e222a;
    --line: #262b34;
    --ink: #e6e8ec;
    --ink-2: #9aa1ad;
    --ink-3: #6b7280;
    /* Статусные цвета фиксированы и не переиспользуются под «просто акцент». */
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px 14px 48px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 980px; margin: 0 auto; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap; margin-bottom: 18px;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
    margin: 32px 0 12px;
  }

  .muted { color: var(--ink-2); }
  .dim { color: var(--ink-3); }

  /* Статус: точка + подпись. Цвет никогда не несёт смысл в одиночку. */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 8px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    font-size: 13px; color: var(--ink-2); white-space: nowrap;
  }
  .pill::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-3); flex: none;
  }
  .pill.good::before { background: var(--good); }
  .pill.warning::before { background: var(--warning); }
  .pill.serious::before { background: var(--serious); }
  .pill.critical::before { background: var(--critical); }
  .pill.good { color: #7fe07f; }
  .pill.warning { color: #ffd479; }
  .pill.critical { color: #ff9b9b; }

  /* Плитки показателей */
  .tiles {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .tile {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .tile .label {
    font-size: 12px; color: var(--ink-3); margin-bottom: 5px;
  }
  /* Пропорциональные цифры: tabular-nums только в колонках таблиц. */
  .tile .value { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .tile .value.sm { font-size: 15px; font-weight: 500; }
  .tile .value.good { color: #7fe07f; }
  .tile .value.warning { color: #ffd479; }
  .tile .value.critical { color: #ff9b9b; }

  .banner {
    margin-top: 10px; padding: 10px 14px; border-radius: 10px;
    background: rgba(208, 59, 59, 0.12);
    border: 1px solid rgba(208, 59, 59, 0.4);
    color: #ff9b9b; font-size: 14px; word-break: break-word;
  }

  /* Аккордеон */
  .acc {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 8px; overflow: hidden;
  }
  .acc > summary {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px; cursor: pointer; list-style: none;
    transition: background 0.12s;
  }
  .acc > summary:hover { background: var(--card-hover); }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc > summary::before {
    content: "▸"; color: var(--ink-3); font-size: 11px;
    transition: transform 0.15s; flex: none;
  }
  .acc[open] > summary::before { transform: rotate(90deg); }
  .acc .title { font-weight: 600; }
  .acc .meta { font-size: 13px; color: var(--ink-2); }
  .acc .spacer { flex: 1 1 auto; }
  .acc-body { padding: 0 14px 14px 30px; }

  /* Вложенный уровень — устройства внутри аккаунта */
  .acc.nested {
    background: transparent; border-color: var(--line);
    border-radius: 8px; margin-bottom: 6px;
  }
  .acc.nested > summary { padding: 10px 12px; }
  .acc.nested .acc-body { padding: 0 12px 12px 26px; }

  /* Таблицы */
  .wrap {
    overflow-x: auto; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card);
  }
  table {
    width: 100%; border-collapse: collapse; font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    padding: 8px 12px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  th {
    color: var(--ink-3); font-weight: 500; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--card-hover); }
  td.num { text-align: right; }
  .empty { color: var(--ink-3); font-style: italic; }

  a { color: #8ab4ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Пагинация */
  .pager {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; font-size: 13px; color: var(--ink-3);
  }
  .pager .spacer { flex: 1 1 auto; }
  .pager a, .pager span.off {
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
  }
  .pager span.off { color: var(--ink-3); opacity: 0.45; }

  /* Форма входа */
  .login { max-width: 340px; margin: 12vh auto 0; }
  input[type=password] {
    font-size: 16px; padding: 10px 12px; width: 100%;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    margin-top: 10px; padding: 10px 18px; font-size: 15px; width: 100%;
    background: #2a2f39; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #333945; }
  .error { color: #ff9b9b; margin-top: 10px; font-size: 14px; }
</style>
