services:
  neiro-push-events:
    build: .
    container_name: neiro-push-events
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8011:8011"
    volumes:
      - neiro_push_events_data:/data
      - ./secrets:/secrets:ro
    networks:
      - server_web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  server_web:
    external: true
    name: server_web

volumes:
  neiro_push_events_data:
